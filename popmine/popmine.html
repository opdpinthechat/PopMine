<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PopMine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', 'Outfit', cursive, sans-serif;
    }
    body {
      margin: 0;
      background: #090c15;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      overflow-x: hidden;
      transition: background 0.8s ease;
      min-height: 100vh;
    }
    h1 {
      margin: 10px 0 2px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }
    #banner {
      height: 22px;
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    #ui {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      align-items: center;
      background: rgba(22, 27, 40, 0.9);
      backdrop-filter: blur(8px);
      padding: 10px 22px;
      border-radius: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      max-width: 760px;
    }
    .stat {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }

    .power-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
    }
    #quickEquipBtn {
      display: none;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #ffffff;
      border: 1px solid #c084fc;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
      animation: quickEquipGlow 1.2s infinite alternate;
      white-space: nowrap;
    }
    @keyframes quickEquipGlow {
      from { transform: scale(0.96); box-shadow: 0 0 6px rgba(168, 85, 247, 0.5); }
      to { transform: scale(1.04); box-shadow: 0 0 15px rgba(168, 85, 247, 1); }
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.25);
      transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
    }
    button.power-btn { background: #e11d48; }
    button.power-btn:hover { background: #be123c; }
    button.range-btn { background: #8b5cf6; }
    button.range-btn:hover { background: #7c3aed; }
    button.income-btn { background: #10b981; }
    button.income-btn:hover { background: #059669; }
    button.laser-btn { background: #f97316; }
    button.laser-btn:hover { background: #ea580c; }
    button.laser-toggle-btn { background: #ef4444; }
    button.laser-toggle-btn:hover { background: #dc2626; }
    button.laser-toggle-btn.active { background: #22c55e; }
    button.laser-toggle-btn.active:hover { background: #16a34a; }
    button.prestige-btn { background: #eab308; color: #000; }
    button.prestige-btn:hover { background: #ca8a04; }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; box-shadow: none !important; }

    @keyframes upgradePulse {
      0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); transform: scale(1); }
      50% { box-shadow: 0 0 16px 5px rgba(168, 85, 247, 0.85); transform: scale(1.04); }
      100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); transform: scale(1); }
    }
    .glow-ready {
      animation: upgradePulse 1.3s infinite ease-in-out;
      border: 1px solid #c084fc !important;
    }

    #layout-wrapper {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    #game-container {
      position: relative;
      width: 600px;
      height: 540px;
      border-radius: 14px;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      border: 3px solid #232738;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      cursor: crosshair;
    }

    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 26, 0.94);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 200;
      border-radius: 14px;
      border: 3px solid #334155;
    }
    #start-overlay h2 {
      font-size: 34px;
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }
    #start-overlay p {
      color: #94a3b8;
      margin: 0;
      font-size: 14px;
      text-align: center;
      max-width: 80%;
    }
    .play-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-size: 20px;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 40px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .play-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 14px 30px rgba(16, 185, 129, 0.6);
    }
    .reset-btn {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .reset-btn:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    #specimen-popup {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.4);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #specimen-popup.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    #side-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-merge-btn {
      width: 150px;
      height: 100px;
      background: linear-gradient(145deg, #06b6d4, #0284c7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 25px rgba(6, 182, 212, 0.35);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sidebar-merge-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 32px rgba(6, 182, 212, 0.55);
    }
    .sidebar-merge-btn .icon {
      font-size: 24px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }
    .specimen-pill {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      color: #e0f2fe;
    }

    @keyframes mergeReadyPulse {
      0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.8); transform: scale(1); }
      50% { box-shadow: 0 0 24px 8px rgba(6, 182, 212, 0.95); transform: scale(1.06); }
      100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); transform: scale(1); }
    }
    .sidebar-merge-btn.merge-glow {
      animation: mergeReadyPulse 1.3s infinite ease-in-out;
      border: 2px solid #67e8f9 !important;
    }

    .wardrobe-btn {
      width: 150px;
      background: linear-gradient(145deg, #a855f7, #6366f1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .wardrobe-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
    }

    #radar-card {
      width: 150px;
      background: rgba(22, 27, 40, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #radar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-align: center;
    }
    .radar-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 5px 6px;
      border-radius: 8px;
    }
    .radar-canvas-icon {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }
    .radar-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .radar-name {
      font-size: 10px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .radar-depth {
      font-size: 9px;
      color: #94a3b8;
    }

    #wardrobe-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 26, 0.96);
      backdrop-filter: blur(12px);
      z-index: 250;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-y: auto;
    }
    #wardrobe-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 10px;
    }
    #wardrobe-header h3 {
      margin: 0;
      font-size: 20px;
      color: #e2e8f0;
    }
    .close-modal-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    #wardrobe-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 520px;
    }
    .aura-card {
      background: rgba(30, 41, 59, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .aura-card:hover:not(.locked) {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.9);
    }
    .aura-card.active {
      border-color: #22c55e;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
    }
    .aura-card.locked {
      background: rgba(15, 23, 42, 0.7);
      border-color: #1e293b;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .aura-preview-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .aura-title {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
    }
    .aura-desc {
      font-size: 10px;
      color: #94a3b8;
    }

    #save-toast {
      position: fixed;
      bottom: 12px;
      right: 12px;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>⛏️ PopMine</h1>
  <div id="banner">📍 Overworld Loam Layer (1.0x)</div>
  <div id="ui">
    <div class="stat">💰 <b>$<span id="money">0</span></b></div>
    <div class="stat">⬇️ <b><span id="depth">0</span>m</b></div>
    <div class="stat">✨ Relics: <b><span id="relics">0</span></b></div>
    <div class="btn-group">
      <div class="power-btn-container">
        <button id="quickEquipBtn"></button>
        <button id="powerBtn" class="power-btn">Power: Lv.1 ($15)</button>
      </div>
      <button id="rangeBtn" class="range-btn">Radius: 1x1 ($60)</button>
      <button id="incomeBtn" class="income-btn">Multiplier: 1.0x ($25)</button>
      <button id="laserBtn" class="laser-btn">Unlock Laser ($100)</button>
      <button id="prestigeBtn" class="prestige-btn" style="display:none;">🌋 Ascend (600m)</button>
    </div>
  </div>

  <div id="layout-wrapper">
    <div id="game-container">
      <div id="start-overlay">
        <h2>⛏️ POPMINE</h2>
        <p>Mine rare ores down to Bedrock, trigger chain explosions, and fuse blocks in the Merge Lab!</p>
        <button id="playBtn" class="play-btn">▶ PLAY GAME</button>
        <button id="wipeSaveBtn" class="reset-btn">🗑️ Wipe Save & Start Fresh ($0)</button>
      </div>

      <div id="wardrobe-modal">
        <div id="wardrobe-header">
          <h3>🎨 AURA WARDROBE</h3>
          <button id="closeWardrobeBtn" class="close-modal-btn">✕ Close</button>
        </div>
        <div id="wardrobe-grid"></div>
      </div>

      <div id="specimen-popup">✨ YOU GOT DIRT BLOCK! ✨</div>
      <canvas id="mineCanvas" width="600" height="540"></canvas>
      <canvas id="mergeCanvas" width="600" height="540" style="display:none;"></canvas>
    </div>

    <div id="side-panel">
      <div id="toggleGameBtn" class="sidebar-merge-btn">
        <span class="icon">🧪</span>
        <span id="mergeBtnText">Merge Lab</span>
        <span class="specimen-pill" id="specimenBadge">4x4 Vault</span>
      </div>

      <button id="openWardrobeBtn" class="wardrobe-btn">
        <span>🎨</span> Grid Auras
      </button>

      <div id="radar-card">
        <div id="radar-title">📡 ORE RADAR</div>
        <div id="radar-list"></div>
      </div>
    </div>
  </div>

  <div id="save-toast">Autosaved</div>

  <script>
    const mineCanvas = document.getElementById("mineCanvas");
    const mineCtx = mineCanvas.getContext("2d");
    const mergeCanvas = document.getElementById("mergeCanvas");
    const mergeCtx = mergeCanvas.getContext("2d");

    let isGameRunning = false;
    let currentMode = "mine";

    const TILE_SIZE = 30;
    const COLS = Math.floor(mineCanvas.width / TILE_SIZE);
    const ROWS = Math.floor(mineCanvas.height / TILE_SIZE);

    let money = 0;
    let currentDepth = 0;
    let prestigeRelics = 0;
    let isMouseDown = false;
    let mouseCol = -1;
    let mouseRow = -1;
    let animTicks = 0;

    let pickPower = 1;
    let powerCost = 15;

    let rangeLevel = 1;
    let rangeCost = 60;
    const RANGE_LABELS = { 1: "1x1", 2: "2x2", 3: "3x3" };

    let incomeMultiplier = 1.0;
    let incomeCost = 25;

    let laserLevel = 0;
    let isLaserRunning = false;
    let laserCost = 100;
    let laserTimer = 0;
    let laserColLeft = 0;
    let activeBeams = [];

    const AURA_SKINS = [
      { id: "clean", name: "Classic Clean", minLv: 1, icon: "⬜", desc: "Minimal, sharp white focus." },
      { id: "enchanted", name: "Enchanted Glint", minLv: 3, icon: "🔮", desc: "Mystic purple shimmer wave." },
      { id: "molten", name: "Molten Core", minLv: 5, icon: "🔥", desc: "Pulsing orange heat with magma corners." },
      { id: "chroma", name: "RGB Chroma", minLv: 8, icon: "🌈", desc: "Cycling rainbow spectral aura." },
      { id: "cyber", name: "Cyber Matrix", minLv: 11, icon: "⚡", desc: "Neon cyan data-mesh with grid spikes." },
      { id: "void", name: "Void Singularity", minLv: 14, icon: "🌌", desc: "Dark matter vortex with gravity pulse." },
      { id: "celestial", name: "Divine Celestial", minLv: 16, icon: "👑", desc: "Radiant golden holy rays & diamond stars." },
      { id: "solar", name: "Solar Flare", minLv: 20, icon: "☀️", desc: "Blazing radiant corona & solar crosshairs." },
      { id: "glitch", name: "Quantum Glitch", minLv: 25, icon: "👾", desc: "Unstable chromatic RGB displacement vectors." },
      { id: "abyssal", name: "Abyssal Kraken", minLv: 30, icon: "🐙", desc: "Deep-ocean bioluminescent pulse." },
      { id: "hypernova", name: "Hypernova Core", minLv: 40, icon: "💥", desc: "White-hot supernova ring with kinetic shockwaves." },
      { id: "godhead", name: "Omnipotent Godhead", minLv: 50, icon: "✨", desc: "Hyper-dimensional sacred geometry & prism heart." }
    ];

    let equippedAuraId = "clean";
    let pendingAuraUnlock = null;

    const SPECIMEN_TIERS = [
      { tier: 1, name: "Dirt", color: "#78350f", texture: "dirt", value: 15, startM: 0 },
      { tier: 2, name: "Cobble", color: "#64748b", texture: "stone", value: 80, startM: 10 },
      { tier: 3, name: "Coal", color: "#475569", texture: "coal", value: 350, startM: 25 },
      { tier: 4, name: "Iron", color: "#d4b996", texture: "iron", value: 1600, startM: 50 },
      { tier: 5, name: "Gold", color: "#facc15", texture: "gold", value: 6500, startM: 120 },
      { tier: 6, name: "Diamond", color: "#38bdf8", texture: "diamond", value: 28000, startM: 230 },
      { tier: 7, name: "Obsidian", color: "#1e1b4b", texture: "obsidian", value: 120000, startM: 270 },
      { tier: 8, name: "Netherite", color: "#1c1917", texture: "netherite", value: 600000, startM: 390 },
      { tier: 9, name: "Bedrock", color: "#09090b", texture: "bedrock", value: 2500000, startM: 600 }
    ];

    const MERGE_SIZE = 4;
    let mergeGrid = Array(MERGE_SIZE).fill(null).map(() => Array(MERGE_SIZE).fill(null));
    let specimenSpawnCooldown = 0;
    let popupTimer = null;

    let draggingItem = null;
    const CELL_SIZE = 82;
    const GRID_OFFSET_X = (mergeCanvas.width - (MERGE_SIZE * CELL_SIZE)) / 2;
    const GRID_OFFSET_Y = 100;

    // Bedrock Altar Location (Directly beneath 4x4 grid)
    const ALTAR_X = (mergeCanvas.width - 320) / 2;
    const ALTAR_Y = 445;
    const ALTAR_W = 320;
    const ALTAR_H = 75;

    let audioCtx = null;
    function playTone(freq, duration = 0.08, type = "sine", vol = 0.08) {
      if (!isGameRunning) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (type === "sine") osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + duration);

      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    function playSoothingBlastSound() {
      if (!isGameRunning) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = "sine";
      subOsc.frequency.setValueAtTime(130, now);
      subOsc.frequency.exponentialRampToValueAtTime(36, now + 0.35);

      subGain.gain.setValueAtTime(0.25, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(now);
      subOsc.stop(now + 0.36);

      const chimeOsc = audioCtx.createOscillator();
      const chimeGain = audioCtx.createGain();
      chimeOsc.type = "triangle";
      chimeOsc.frequency.setValueAtTime(320, now);
      chimeOsc.frequency.exponentialRampToValueAtTime(80, now + 0.2);

      chimeGain.gain.setValueAtTime(0.06, now);
      chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

      chimeOsc.connect(chimeGain);
      chimeGain.connect(audioCtx.destination);
      chimeOsc.start(now);
      chimeOsc.stop(now + 0.22);
    }

    function playSpecimenFoundSound() {
      if (!isGameRunning) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      const chord = [523.25, 659.25, 783.99, 1046.50];
      chord.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = now + idx * 0.055;

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.06, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.32);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.34);
      });
    }

    // Divine Altar Sacrifice Sound
    function playAltarSacrificeSound() {
      if (!isGameRunning) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      // Deep celestial swell
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(65.4, now);
      osc.frequency.exponentialRampToValueAtTime(130.8, now + 0.5);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.65);

      // Ethereal high chord
      [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
        const hOsc = audioCtx.createOscillator();
        const hGain = audioCtx.createGain();
        hOsc.type = "triangle";
        hOsc.frequency.setValueAtTime(freq, now + 0.1);

        hGain.gain.setValueAtTime(0.05, now + 0.1);
        hGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8 + idx * 0.05);

        hOsc.connect(hGain);
        hGain.connect(audioCtx.destination);
        hOsc.start(now + 0.1);
        hOsc.stop(now + 0.9);
      });
    }

    function drawMinecraftBlock(ctx, x, y, size, block) {
      const type = block.texture || "dirt";

      ctx.fillStyle = block.color;
      ctx.fillRect(x, y, size, size);

      ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
      ctx.fillRect(x, y, size, 2);
      ctx.fillRect(x, y, 2, size);
      ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
      ctx.fillRect(x, y + size - 2, size, 2);
      ctx.fillRect(x + size - 2, y, 2, size);

      if (type === "dirt") {
        ctx.fillStyle = "#5c3a21";
        ctx.fillRect(x + 4, y + 6, 4, 3);
        ctx.fillRect(x + 16, y + 18, 5, 4);
      } else if (type === "stone") {
        ctx.fillStyle = "#474f5d";
        ctx.fillRect(x + 6, y + 6, 6, 4);
        ctx.fillRect(x + 16, y + 14, 5, 5);
      } else if (type === "coal" || type === "iron" || type === "gold" || type === "diamond") {
        let oreColor = type === "coal" ? "#111827" : (type === "iron" ? "#d4b996" : (type === "gold" ? "#fde047" : "#38bdf8"));
        ctx.fillStyle = oreColor;
        ctx.fillRect(x + 6, y + 8, 5, 4);
        ctx.fillRect(x + 16, y + 6, 4, 4);
        ctx.fillRect(x + 10, y + 18, 6, 5);
      } else if (type === "obsidian") {
        ctx.fillStyle = "#2e1065";
        ctx.fillRect(x + 5, y + 5, 7, 6);
        ctx.fillRect(x + 14, y + 15, 7, 6);
      } else if (type === "netherite") {
        ctx.fillStyle = "#292524";
        ctx.fillRect(x + 4, y + 4, 8, 4);
        ctx.fillRect(x + 14, y + 14, 8, 4);
        ctx.fillStyle = "#78350f";
        ctx.fillRect(x + 12, y + 8, 4, 4);
      } else if (type === "bedrock") {
        ctx.fillStyle = "#27272a";
        ctx.fillRect(x + 3, y + 3, 6, 6);
        ctx.fillRect(x + 13, y + 13, 8, 8);
        ctx.fillRect(x + 16, y + 4, 5, 5);
      } else if (type === "tnt") {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(x, y + 10, size, 10);
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 9px 'Outfit', sans-serif";
        ctx.fillText("TNT", x + 6, y + 18);
      }

      if (block.isSpecimen) {
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y + 2, size - 4, size - 4);
      }

      if (block.hp < block.maxHp) {
        const stage = (block.maxHp - block.hp) / block.maxHp;
        ctx.fillStyle = `rgba(0, 0, 0, ${0.2 + stage * 0.5})`;
        ctx.fillRect(x, y, size, size);
      }
    }

    function getBiomeInfo(depth) {
      if (depth < 45) return { name: "Overworld Loam Layer", bonus: 1.0, bg: "#090d16", banner: "#38bdf8", tier: 1 };
      if (depth < 110) return { name: "Deepslate Cobble & Coal", bonus: 1.8, bg: "#0f141c", banner: "#818cf8", tier: 2 };
      if (depth < 220) return { name: "Iron & Golden Veins", bonus: 3.2, bg: "#1a1608", banner: "#fbbf24", tier: 4 };
      if (depth < 380) return { name: "Diamonds & Obsidian Mantle", bonus: 5.5, bg: "#130b1c", banner: "#22d3ee", tier: 6 };
      if (depth < 600) return { name: "Ancient Debris Crust", bonus: 9.0, bg: "#1f0a0a", banner: "#f87171", tier: 8 };
      return { name: "THE BEDROCK CORE", bonus: 15.0, bg: "#030303", banner: "#a1a1aa", tier: 9 };
    }

    function updateBiomeVisuals() {
      const b = getBiomeInfo(currentDepth);
      document.body.style.background = b.bg;
      const banner = document.getElementById("banner");
      banner.style.color = b.banner;
      banner.innerText = `📍 ${b.name} (${b.bonus}x Value Multiplier)`;
    }

    function generateRow(depth) {
      let newRow = [];
      const biome = getBiomeInfo(depth);
      specimenSpawnCooldown++;

      let spawnSpecimenThisRow = false;
      let specimenCol = Math.floor(Math.random() * COLS);
      if (specimenSpawnCooldown >= 12) {
        spawnSpecimenThisRow = true;
        specimenSpawnCooldown = 0;
      }

      for (let c = 0; c < COLS; c++) {
        let rand = Math.random();
        let block;

        if (spawnSpecimenThisRow && c === specimenCol) {
          const specInfo = SPECIMEN_TIERS[biome.tier - 1] || SPECIMEN_TIERS[0];
          block = {
            texture: specInfo.texture,
            hp: 6, maxHp: 6,
            val: specInfo.value,
            color: specInfo.color,
            isSpecimen: true,
            specimenTier: specInfo.tier
          };
        } else if (rand < 0.012) {
          block = { type: "tnt", texture: "tnt", hp: 1, maxHp: 1, val: 35, color: "#dc2626" };
        } else if (depth < 45) {
          if (rand > 0.82) block = { texture: "coal", hp: 4, maxHp: 4, val: 12, color: "#475569" };
          else if (rand > 0.42) block = { texture: "stone", hp: 2, maxHp: 2, val: 5, color: "#64748b" };
          else block = { texture: "dirt", hp: 1, maxHp: 1, val: 2, color: "#78350f" };
        } else if (depth < 110) {
          if (rand > 0.78) block = { texture: "iron", hp: 7, maxHp: 7, val: 40, color: "#475569" };
          else if (rand > 0.4) block = { texture: "coal", hp: 5, maxHp: 5, val: 18, color: "#334155" };
          else block = { texture: "stone", hp: 3, maxHp: 3, val: 8, color: "#64748b" };
        } else if (depth < 220) {
          if (rand > 0.75) block = { texture: "gold", hp: 13, maxHp: 13, val: 120, color: "#334155" };
          else if (rand > 0.32) block = { texture: "iron", hp: 8, maxHp: 8, val: 55, color: "#475569" };
          else block = { texture: "stone", hp: 5, maxHp: 5, val: 20, color: "#334155" };
        } else if (depth < 380) {
          if (rand > 0.75) block = { texture: "obsidian", hp: 28, maxHp: 28, val: 450, color: "#1e1b4b" };
          else if (rand > 0.38) block = { texture: "diamond", hp: 16, maxHp: 16, val: 280, color: "#334155" };
          else block = { texture: "gold", hp: 9, maxHp: 9, val: 130, color: "#475569" };
        } else if (depth < 600) {
          if (rand > 0.72) block = { texture: "netherite", hp: 48, maxHp: 48, val: 1400, color: "#1c1917" };
          else if (rand > 0.38) block = { texture: "obsidian", hp: 30, maxHp: 30, val: 550, color: "#1e1b4b" };
          else block = { texture: "diamond", hp: 18, maxHp: 18, val: 320, color: "#334155" };
        } else {
          block = { texture: "bedrock", hp: 120, maxHp: 120, val: 4500, color: "#09090b" };
        }

        newRow.push({ ...block, biomeBonus: biome.bonus });
      }
      return newRow;
    }

    let grid = [];
    for (let r = 0; r < ROWS; r++) grid.push(generateRow(r));

    let particles = [];
    let floatTexts = [];

    function checkTopRowClear() {
      if (grid[0].every(cell => cell === null)) {
        grid.shift();
        currentDepth++;
        document.getElementById("depth").innerText = currentDepth;
        updateBiomeVisuals();
        updateGlowUI();
        grid.push(generateRow(currentDepth + ROWS));

        particles.forEach(p => p.y -= TILE_SIZE);
        floatTexts.forEach(ft => ft.y -= TILE_SIZE);
      }
    }

    function addSpecimenToMergeGrid(tier) {
      for (let r = 0; r < MERGE_SIZE; r++) {
        for (let c = 0; c < MERGE_SIZE; c++) {
          if (mergeGrid[r][c] === null) {
            mergeGrid[r][c] = tier;
            return true;
          }
        }
      }
      return false;
    }

    function destroyBlock(r, c, customPower) {
      if (!grid[r] || !grid[r][c]) return;
      let b = grid[r][c];
      b.hp -= customPower;

      particles.push({
        x: (c + 0.5) * TILE_SIZE,
        y: (r + 0.5) * TILE_SIZE,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        color: b.color,
        size: 3,
        life: 0.6
      });

      if (b.hp <= 0) {
        if (b.type === "tnt") {
          grid[r][c] = null;
          triggerExplosion(r, c);
          return;
        }

        if (b.isSpecimen) {
          addSpecimenToMergeGrid(b.specimenTier);
          const specInfo = SPECIMEN_TIERS[b.specimenTier - 1];
          showSpecimenPopup(specInfo.name);
          playSpecimenFoundSound();
        }

        let baseEarn = b.val * (b.biomeBonus || 1.0);
        let relicBonus = 1 + prestigeRelics;
        let earned = Math.max(1, Math.round(baseEarn * incomeMultiplier * relicBonus));
        money += earned;
        document.getElementById("money").innerText = money;
        updateGlowUI();

        for (let i = 0; i < 5; i++) {
          particles.push({
            x: (c + 0.5) * TILE_SIZE,
            y: (r + 0.5) * TILE_SIZE,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7 - 1,
            color: b.color,
            size: 3,
            life: 0.8
          });
        }

        floatTexts.push({
          x: (c + 0.5) * TILE_SIZE,
          y: (r + 0.5) * TILE_SIZE,
          text: `+$${earned}`,
          alpha: 1
        });

        grid[r][c] = null;
      }
    }

    function triggerExplosion(centerR, centerC) {
      playSoothingBlastSound();
      for (let dr = -2; dr <= 2; dr++) {
        for (let dc = -2; dc <= 2; dc++) {
          let tr = centerR + dr;
          let tc = centerC + dc;
          if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS && grid[tr][tc]) {
            destroyBlock(tr, tc, 999);
          }
        }
      }
    }

    function getTargetArea(centerCol, centerRow) {
      let targets = [];
      if (rangeLevel === 1) targets.push({ r: centerRow, c: centerCol });
      else if (rangeLevel === 2) {
        for (let dr = 0; dr <= 1; dr++) for (let dc = 0; dc <= 1; dc++) targets.push({ r: centerRow + dr, c: centerCol + dc });
      } else if (rangeLevel === 3) {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) targets.push({ r: centerRow + dr, c: centerCol + dc });
      }
      return targets;
    }

    function mineAt(x, y) {
      if (!isGameRunning) return;
      const centerCol = Math.floor(x / TILE_SIZE);
      const centerRow = Math.floor(y / TILE_SIZE);
      const targets = getTargetArea(centerCol, centerRow);

      let hits = 0;
      targets.forEach(t => {
        if (t.r >= 0 && t.r < ROWS && t.c >= 0 && t.c < COLS && grid[t.r][t.c]) {
          hits++;
          destroyBlock(t.r, t.c, pickPower);
        }
      });

      if (hits > 0) playTone(440, 0.06, "sine", 0.05);
      checkTopRowClear();
    }

    function updateLasers() {
      if (!isGameRunning || laserLevel === 0 || !isLaserRunning) return;
      laserTimer++;

      if (laserTimer % 11 === 0) {
        let leftTarget = -1;
        for (let c = 0; c < COLS; c++) {
          let test = (laserColLeft + c) % COLS;
          if (grid[0][test]) { leftTarget = test; break; }
        }
        if (leftTarget !== -1) {
          laserColLeft = (leftTarget + 1) % COLS;
          let dmg = Math.max(1, Math.ceil(grid[0][leftTarget].maxHp / 3));
          destroyBlock(0, leftTarget, dmg);
          activeBeams.push({ fromX: 0, toX: (leftTarget + 0.8) * TILE_SIZE, y: TILE_SIZE / 2, alpha: 1.0 });
        }
        checkTopRowClear();
      }
    }

    const toggleBtn = document.getElementById("toggleGameBtn");
    const mergeBtnText = document.getElementById("mergeBtnText");
    toggleBtn.onclick = () => {
      if (!isGameRunning) return;
      if (currentMode === "mine") {
        currentMode = "merge";
        mineCanvas.style.display = "none";
        mergeCanvas.style.display = "block";
        mergeBtnText.innerText = "Mine Mode";
        toggleBtn.style.background = "linear-gradient(145deg, #8b5cf6, #7c3aed)";
        toggleBtn.querySelector(".icon").innerText = "⛏️";
      } else {
        currentMode = "mine";
        mergeCanvas.style.display = "none";
        mineCanvas.style.display = "block";
        mergeBtnText.innerText = "Merge Lab";
        toggleBtn.style.background = "linear-gradient(145deg, #06b6d4, #0284c7)";
        toggleBtn.querySelector(".icon").innerText = "🧪";
      }
      updateGlowUI();
    };

    // MERGE LAB CONTROLS
    mergeCanvas.addEventListener("mousedown", (e) => {
      if (!isGameRunning) return;
      const rect = mergeCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const c = Math.floor((clickX - GRID_OFFSET_X) / CELL_SIZE);
      const r = Math.floor((clickY - GRID_OFFSET_Y) / CELL_SIZE);

      if (r >= 0 && r < MERGE_SIZE && c >= 0 && c < MERGE_SIZE) {
        if (mergeGrid[r][c] !== null) {
          draggingItem = {
            tier: mergeGrid[r][c],
            originR: r,
            originC: c,
            curX: clickX,
            curY: clickY
          };
          playTone(400, 0.05, "sine", 0.04);
        }
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (draggingItem && currentMode === "merge") {
        const rect = mergeCanvas.getBoundingClientRect();
        draggingItem.curX = e.clientX - rect.left;
        draggingItem.curY = e.clientY - rect.top;
      }
    });

    window.addEventListener("mouseup", (e) => {
      if (!draggingItem) return;

      const rect = mergeCanvas.getBoundingClientRect();
      const dropX = e.clientX - rect.left;
      const dropY = e.clientY - rect.top;

      const c = Math.floor((dropX - GRID_OFFSET_X) / CELL_SIZE);
      const r = Math.floor((dropY - GRID_OFFSET_Y) / CELL_SIZE);

      const originR = draggingItem.originR;
      const originC = draggingItem.originC;
      const tier = draggingItem.tier;

      // 1. Check if dropped directly onto the Bedrock Altar of Ascension
      if (dropX >= ALTAR_X && dropX <= ALTAR_X + ALTAR_W && dropY >= ALTAR_Y && dropY <= ALTAR_Y + ALTAR_H) {
        if (tier === 9) {
          // SACRIFICE BEDROCK CORE!
          mergeGrid[originR][originC] = null;
          const cashReward = 10000000;
          money += cashReward;
          prestigeRelics += 1;

          document.getElementById("money").innerText = money;
          document.getElementById("relics").innerText = prestigeRelics;
          playAltarSacrificeSound();

          // Golden spark shower
          for (let i = 0; i < 25; i++) {
            particles.push({
              x: ALTAR_X + ALTAR_W / 2,
              y: ALTAR_Y + ALTAR_H / 2,
              vx: (Math.random() - 0.5) * 12,
              vy: (Math.random() - 0.5) * 12 - 2,
              color: Math.random() > 0.5 ? "#facc15" : "#e0f2fe",
              size: 5,
              life: 1.2
            });
          }

          const popup = document.getElementById("specimen-popup");
          popup.innerText = `👑 BEDROCK TRANSCENDED! +$10M & +1 RELIC ✨`;
          popup.classList.add("show");
          clearTimeout(popupTimer);
          popupTimer = setTimeout(() => popup.classList.remove("show"), 1500);

          updateGlowUI();
          draggingItem = null;
          return;
        } else {
          // Non-bedrock blocks cannot be sacrificed
          playTone(200, 0.1, "sawtooth", 0.05);
        }
      }

      // 2. Standard Grid Dropping / Merging
      if (r >= 0 && r < MERGE_SIZE && c >= 0 && c < MERGE_SIZE) {
        if (r === originR && c === originC) {
        } else if (mergeGrid[r][c] === null) {
          mergeGrid[r][c] = tier;
          mergeGrid[originR][originC] = null;
          playTone(320, 0.05, "sine", 0.04);
        } else if (mergeGrid[r][c] === tier) {
          if (tier < SPECIMEN_TIERS.length) {
            mergeGrid[r][c] = tier + 1;
            mergeGrid[originR][originC] = null;

            let reward = SPECIMEN_TIERS[tier].value * 8;
            money += reward;
            document.getElementById("money").innerText = money;
            playTone(600 + tier * 80, 0.18, "square", 0.12);
            updateGlowUI();
          }
        } else {
          let temp = mergeGrid[r][c];
          mergeGrid[r][c] = tier;
          mergeGrid[originR][originC] = temp;
          playTone(300, 0.05, "sine", 0.04);
        }
      }

      draggingItem = null;
    });

    function renderMergeGame() {
      mergeCtx.clearRect(0, 0, mergeCanvas.width, mergeCanvas.height);

      mergeCtx.fillStyle = "#111827";
      mergeCtx.fillRect(0, 0, mergeCanvas.width, mergeCanvas.height);

      mergeCtx.fillStyle = "#f8fafc";
      mergeCtx.font = "bold 20px 'Fredoka', sans-serif";
      mergeCtx.textAlign = "center";
      mergeCtx.fillText("🧪 SPECIMEN MERGE VAULT", mergeCanvas.width / 2, 28);

      let activeTier = draggingItem ? draggingItem.tier : null;
      if (!activeTier) {
        for (let r = 0; r < MERGE_SIZE; r++) {
          for (let c = 0; c < MERGE_SIZE; c++) {
            if (mergeGrid[r][c] !== null) { activeTier = mergeGrid[r][c]; break; }
          }
          if (activeTier) break;
        }
      }

      const previewBoxY = 40;
      const previewBoxH = 48;
      mergeCtx.fillStyle = "rgba(30, 41, 59, 0.85)";
      mergeCtx.strokeStyle = "#334155";
      mergeCtx.lineWidth = 1.5;
      mergeCtx.beginPath();
      mergeCtx.roundRect(30, previewBoxY, mergeCanvas.width - 60, previewBoxH, 12);
      mergeCtx.fill();
      mergeCtx.stroke();

      if (activeTier && activeTier < SPECIMEN_TIERS.length) {
        const cur = SPECIMEN_TIERS[activeTier - 1];
        const nxt = SPECIMEN_TIERS[activeTier];

        const iconSize = 30;
        const startX = 120;
        const iconY = previewBoxY + (previewBoxH - iconSize) / 2;

        drawMinecraftBlock(mergeCtx, startX, iconY, iconSize, { color: cur.color, texture: cur.texture, hp: 1, maxHp: 1 });
        
        mergeCtx.fillStyle = "#94a3b8";
        mergeCtx.font = "bold 18px 'Fredoka', sans-serif";
        mergeCtx.textAlign = "center";
        mergeCtx.fillText("+", startX + 45, iconY + 22);

        drawMinecraftBlock(mergeCtx, startX + 60, iconY, iconSize, { color: cur.color, texture: cur.texture, hp: 1, maxHp: 1 });

        mergeCtx.fillStyle = "#38bdf8";
        mergeCtx.font = "bold 20px 'Fredoka', sans-serif";
        mergeCtx.fillText("➔", startX + 115, iconY + 22);

        drawMinecraftBlock(mergeCtx, startX + 138, iconY, iconSize, { color: nxt.color, texture: nxt.texture, hp: 1, maxHp: 1 });

        mergeCtx.fillStyle = "#facc15";
        mergeCtx.font = "bold 13px 'Fredoka', sans-serif";
        mergeCtx.textAlign = "left";
        mergeCtx.fillText(`+$${cur.value * 8}`, startX + 180, iconY + 20);
      } else if (activeTier === SPECIMEN_TIERS.length) {
        mergeCtx.fillStyle = "#facc15";
        mergeCtx.font = "bold 13px 'Fredoka', sans-serif";
        mergeCtx.textAlign = "center";
        mergeCtx.fillText(`👑 DRAG BEDROCK BELOW TO TRANSCEND!`, mergeCanvas.width / 2, previewBoxY + 29);
      } else {
        mergeCtx.fillStyle = "#94a3b8";
        mergeCtx.font = "12px 'Fredoka', sans-serif";
        mergeCtx.textAlign = "center";
        mergeCtx.fillText("Mine rare specimens underground and drag identical blocks together!", mergeCanvas.width / 2, previewBoxY + 29);
      }

      // Draw 4x4 Grid
      for (let r = 0; r < MERGE_SIZE; r++) {
        for (let c = 0; c < MERGE_SIZE; c++) {
          let x = GRID_OFFSET_X + c * CELL_SIZE;
          let y = GRID_OFFSET_Y + r * CELL_SIZE;

          mergeCtx.fillStyle = "#1e293b";
          mergeCtx.strokeStyle = "#334155";
          mergeCtx.lineWidth = 2;
          mergeCtx.beginPath();
          mergeCtx.roundRect(x + 3, y + 3, CELL_SIZE - 6, CELL_SIZE - 6, 10);
          mergeCtx.fill();
          mergeCtx.stroke();

          let tier = mergeGrid[r][c];
          if (draggingItem && draggingItem.originR === r && draggingItem.originC === c) continue;

          if (tier !== null) {
            let spec = SPECIMEN_TIERS[tier - 1];
            drawMinecraftBlock(mergeCtx, x + 16, y + 10, CELL_SIZE - 32, {
              color: spec.color,
              texture: spec.texture,
              hp: 1, maxHp: 1
            });

            mergeCtx.fillStyle = "#ffffff";
            mergeCtx.font = "bold 11px 'Fredoka', sans-serif";
            mergeCtx.textAlign = "center";
            mergeCtx.fillText(spec.name, x + CELL_SIZE / 2, y + CELL_SIZE - 5);
          }
        }
      }

      // Render the Bedrock Sacrifice Altar
      const altarGlow = Math.sin(Date.now() * 0.004) * 0.2 + 0.8;
      mergeCtx.save();
      mergeCtx.fillStyle = "rgba(15, 23, 42, 0.95)";
      mergeCtx.strokeStyle = `rgba(234, 179, 8, ${altarGlow})`;
      mergeCtx.lineWidth = 2.5;
      mergeCtx.beginPath();
      mergeCtx.roundRect(ALTAR_X, ALTAR_Y, ALTAR_W, ALTAR_H, 16);
      mergeCtx.fill();
      mergeCtx.stroke();

      mergeCtx.fillStyle = "#facc15";
      mergeCtx.font = "bold 13px 'Fredoka', sans-serif";
      mergeCtx.textAlign = "center";
      mergeCtx.fillText("⚡ ALTAR OF ASCENSION ⚡", ALTAR_X + ALTAR_W / 2, ALTAR_Y + 28);

      mergeCtx.fillStyle = "#e2e8f0";
      mergeCtx.font = "600 11px 'Fredoka', sans-serif";
      mergeCtx.fillText("Drag Bedrock here ➔ Get $10M + 1 Relic ✨", ALTAR_X + ALTAR_W / 2, ALTAR_Y + 52);
      mergeCtx.restore();

      // Render Dragging Ghost Block
      if (draggingItem) {
        const spec = SPECIMEN_TIERS[draggingItem.tier - 1];
        const blockW = CELL_SIZE - 28;

        mergeCtx.shadowColor = "rgba(0,0,0,0.5)";
        mergeCtx.shadowBlur = 15;
        drawMinecraftBlock(mergeCtx, draggingItem.curX - blockW / 2, draggingItem.curY - blockW / 2, blockW, {
          color: spec.color,
          texture: spec.texture,
          hp: 1, maxHp: 1
        });
        mergeCtx.shadowBlur = 0;

        mergeCtx.fillStyle = "#ffffff";
        mergeCtx.font = "bold 12px 'Fredoka', sans-serif";
        mergeCtx.textAlign = "center";
        mergeCtx.fillText(spec.name, draggingItem.curX, draggingItem.curY + blockW / 2 + 14);
      }
    }

    function renderCustomReticle(ctx, targets) {
      animTicks++;

      targets.forEach(t => {
        if (t.r < 0 || t.r >= ROWS || t.c < 0 || t.c >= COLS) return;
        const bx = t.c * TILE_SIZE;
        const by = t.r * TILE_SIZE;

        if (equippedAuraId === "clean") {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
          ctx.lineWidth = 2;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        } else if (equippedAuraId === "enchanted") {
          ctx.fillStyle = `rgba(192, 132, 252, ${0.12 + Math.sin(animTicks * 0.08 + (t.r + t.c)) * 0.08})`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = `hsl(${(animTicks * 2.5 + (t.r + t.c) * 20) % 60 + 260}, 85%, 65%)`;
          ctx.lineWidth = 2.5;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        } else if (equippedAuraId === "molten") {
          ctx.fillStyle = `rgba(249, 115, 22, ${0.18 + Math.sin(animTicks * 0.12) * 0.08})`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = `hsl(${(animTicks * 3) % 40 + 15}, 95%, 58%)`;
          ctx.lineWidth = 3;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#fef08a";
          ctx.lineWidth = 2;
          const len = 6;
          ctx.beginPath();
          ctx.moveTo(bx + 1, by + len); ctx.lineTo(bx + 1, by + 1); ctx.lineTo(bx + len, by + 1);
          ctx.moveTo(bx + TILE_SIZE - 1, by + len); ctx.lineTo(bx + TILE_SIZE - 1, by + 1); ctx.lineTo(bx + TILE_SIZE - len, by + 1);
          ctx.stroke();
        } else if (equippedAuraId === "chroma") {
          const hue = (animTicks * 4 + (t.r * COLS + t.c) * 15) % 360;
          ctx.fillStyle = `hsla(${hue}, 90%, 55%, 0.22)`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
          ctx.lineWidth = 3.5;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.fillStyle = "#ffffff";
          const spark = 2.5 + Math.sin(animTicks * 0.2) * 1.5;
          ctx.fillRect(bx + (TILE_SIZE - spark) / 2, by + (TILE_SIZE - spark) / 2, spark, spark);
        } else if (equippedAuraId === "cyber") {
          ctx.fillStyle = `rgba(6, 182, 212, ${0.15 + Math.sin(animTicks * 0.15) * 0.08})`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#22d3ee";
          ctx.lineWidth = 2;
          ctx.strokeRect(bx + 2, by + 2, TILE_SIZE - 4, TILE_SIZE - 4);

          ctx.strokeStyle = "#a5f3fc";
          ctx.lineWidth = 2;
          const s = 5;
          ctx.strokeRect(bx, by, s, s);
          ctx.strokeRect(bx + TILE_SIZE - s, by, s, s);
          ctx.strokeRect(bx, by + TILE_SIZE - s, s, s);
          ctx.strokeRect(bx + TILE_SIZE - s, by + TILE_SIZE - s, s, s);
        } else if (equippedAuraId === "void") {
          ctx.fillStyle = "rgba(15, 23, 42, 0.4)";
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          const rotHue = (animTicks * 2) % 40 + 260;
          ctx.strokeStyle = `hsl(${rotHue}, 90%, 65%)`;
          ctx.lineWidth = 3;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.fillStyle = "#000000";
          const coreSize = 7 + Math.sin(animTicks * 0.15) * 3;
          ctx.beginPath();
          ctx.arc(bx + TILE_SIZE / 2, by + TILE_SIZE / 2, coreSize / 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "#c084fc";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (equippedAuraId === "celestial") {
          const goldHue = (animTicks * 1.5) % 20 + 45;
          ctx.fillStyle = `hsla(${goldHue}, 100%, 65%, 0.28)`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#fef08a";
          ctx.lineWidth = 3.5;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.save();
          ctx.translate(bx + TILE_SIZE / 2, by + TILE_SIZE / 2);
          ctx.rotate(animTicks * 0.05);
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-4, -4, 8, 8);
          ctx.restore();
        } else if (equippedAuraId === "solar") {
          ctx.fillStyle = `rgba(251, 146, 60, ${0.25 + Math.sin(animTicks * 0.2) * 0.1})`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#ea580c";
          ctx.lineWidth = 4;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#fef08a";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(bx + TILE_SIZE / 2, by); ctx.lineTo(bx + TILE_SIZE / 2, by + TILE_SIZE);
          ctx.moveTo(bx, by + TILE_SIZE / 2); ctx.lineTo(bx + TILE_SIZE, by + TILE_SIZE / 2);
          ctx.stroke();
        } else if (equippedAuraId === "glitch") {
          const jitterX = (Math.random() - 0.5) * 4;
          const jitterY = (Math.random() - 0.5) * 4;

          ctx.strokeStyle = "#ec4899";
          ctx.lineWidth = 2.5;
          ctx.strokeRect(bx + 1 + jitterX, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#06b6d4";
          ctx.lineWidth = 2;
          ctx.strokeRect(bx + 1, by + 1 + jitterY, TILE_SIZE - 2, TILE_SIZE - 2);
        } else if (equippedAuraId === "abyssal") {
          ctx.fillStyle = `rgba(13, 148, 136, ${0.2 + Math.sin(animTicks * 0.1) * 0.12})`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#2dd4bf";
          ctx.lineWidth = 3;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#99f6e4";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(bx + 4, by + 4, 6, 0, Math.PI / 2);
          ctx.arc(bx + TILE_SIZE - 4, by + TILE_SIZE - 4, 6, Math.PI, Math.PI * 1.5);
          ctx.stroke();
        } else if (equippedAuraId === "hypernova") {
          ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.sin(animTicks * 0.25) * 0.15})`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#f43f5e";
          ctx.lineWidth = 4;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          const shockR = (animTicks * 0.8) % (TILE_SIZE / 2);
          ctx.strokeStyle = `rgba(253, 224, 71, ${1 - shockR / (TILE_SIZE / 2)})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(bx + TILE_SIZE / 2, by + TILE_SIZE / 2, shockR, 0, Math.PI * 2);
          ctx.stroke();
        } else if (equippedAuraId === "godhead") {
          const godHue = (animTicks * 5) % 360;
          ctx.fillStyle = `hsla(${godHue}, 100%, 75%, 0.35)`;
          ctx.fillRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 4;
          ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);

          ctx.save();
          ctx.translate(bx + TILE_SIZE / 2, by + TILE_SIZE / 2);
          ctx.rotate(animTicks * 0.08);
          ctx.strokeStyle = `hsl(${godHue}, 100%, 70%)`;
          ctx.lineWidth = 2;
          ctx.strokeRect(-6, -6, 12, 12);
          ctx.rotate(Math.PI / 4);
          ctx.strokeStyle = "#fef08a";
          ctx.strokeRect(-6, -6, 12, 12);
          ctx.restore();
        }
      });
    }

    // Mining Controls
    mineCanvas.addEventListener("mousedown", (e) => {
      isMouseDown = true;
      const rect = mineCanvas.getBoundingClientRect();
      mineAt(e.clientX - rect.left, e.clientY - rect.top);
    });
    window.addEventListener("mouseup", () => isMouseDown = false);
    mineCanvas.addEventListener("mousemove", (e) => {
      const rect = mineCanvas.getBoundingClientRect();
      mouseCol = Math.floor((e.clientX - rect.left) / TILE_SIZE);
      mouseRow = Math.floor((e.clientY - rect.top) / TILE_SIZE);
      if (isMouseDown) mineAt(e.clientX - rect.left, e.clientY - rect.top);
    });

    // Upgrades with smoothed scaling curves
    document.getElementById("powerBtn").onclick = () => {
      if (!isGameRunning) return;
      if (money >= powerCost) {
        money -= powerCost;
        pickPower++;
        powerCost = Math.floor(powerCost * 1.28);
        document.getElementById("money").innerText = money;
        document.getElementById("powerBtn").innerText = `Power: Lv.${pickPower} ($${powerCost})`;

        checkAuraUnlockNotification(pickPower);
        updateGlowUI();
      }
    };

    const rangeBtn = document.getElementById("rangeBtn");
    rangeBtn.onclick = () => {
      if (!isGameRunning) return;
      if (money >= rangeCost && rangeLevel < 3) {
        money -= rangeCost;
        rangeLevel++;
        rangeCost *= 3;
        document.getElementById("money").innerText = money;
        rangeBtn.innerText = rangeLevel === 3 ? "Radius: 3x3 (MAX)" : `Radius: ${RANGE_LABELS[rangeLevel]} ($${rangeCost})`;
        if (rangeLevel === 3) rangeBtn.disabled = true;
        updateGlowUI();
      }
    };

    const incomeBtn = document.getElementById("incomeBtn");
    incomeBtn.onclick = () => {
      if (!isGameRunning) return;
      if (money >= incomeCost) {
        money -= incomeCost;
        incomeMultiplier = parseFloat((incomeMultiplier + 0.5).toFixed(1));
        incomeCost = Math.floor(incomeCost * 1.45);
        document.getElementById("money").innerText = money;
        incomeBtn.innerText = `Multiplier: ${incomeMultiplier}x ($${incomeCost})`;
        updateGlowUI();
      }
    };

    const laserBtn = document.getElementById("laserBtn");
    laserBtn.onclick = () => {
      if (!isGameRunning) return;
      if (laserLevel === 0) {
        if (money >= laserCost) {
          money -= laserCost;
          laserLevel = 1;
          isLaserRunning = true;
          document.getElementById("money").innerText = money;
          updateGlowUI();
        }
      } else {
        isLaserRunning = !isLaserRunning;
        updateLaserBtnUI();
      }
    };

    // Ascension
    document.getElementById("prestigeBtn").onclick = () => {
      if (!isGameRunning) return;
      if (currentDepth >= 600) {
        prestigeRelics++;
        currentDepth = 0;
        money = 0;
        pickPower = 1;
        rangeLevel = 1;
        laserLevel = 0;
        isLaserRunning = false;
        powerCost = 15;
        rangeCost = 60;
        incomeCost = 25;
        laserCost = 100;
        incomeMultiplier = 1.0;
        equippedAuraId = "clean";
        hideQuickEquip();

        grid = [];
        for (let r = 0; r < ROWS; r++) grid.push(generateRow(r));

        document.getElementById("money").innerText = 0;
        document.getElementById("depth").innerText = 0;
        document.getElementById("relics").innerText = prestigeRelics;
        document.getElementById("powerBtn").innerText = `Power: Lv.1 ($${powerCost})`;
        document.getElementById("rangeBtn").innerText = `Radius: 1x1 ($${rangeCost})`;
        document.getElementById("rangeBtn").disabled = false;
        document.getElementById("incomeBtn").innerText = `Multiplier: 1.0x ($${incomeCost})`;
        document.getElementById("prestigeBtn").style.display = "none";
        updateBiomeVisuals();
        updateGlowUI();
      }
    };

    // Autosave
    function saveGame() {
      if (!isGameRunning) return;
      const state = {
        money, currentDepth, prestigeRelics, pickPower, powerCost,
        rangeLevel, rangeCost, incomeMultiplier, incomeCost,
        laserLevel, isLaserRunning, mergeGrid, equippedAuraId
      };
      localStorage.setItem("popmine_full_save", JSON.stringify(state));
    }
    setInterval(saveGame, 4000);

    function loadGame() {
      const raw = localStorage.getItem("popmine_full_save");
      if (!raw) {
        updateOreRadar();
        return;
      }
      try {
        const s = JSON.parse(raw);
        money = s.money || 0;
        currentDepth = s.currentDepth || 0;
        prestigeRelics = s.prestigeRelics || 0;
        pickPower = s.pickPower || 1;
        powerCost = s.powerCost || 15;
        rangeLevel = s.rangeLevel || 1;
        rangeCost = s.rangeCost || 60;
        incomeMultiplier = s.incomeMultiplier || 1.0;
        incomeCost = s.incomeCost || 25;
        laserLevel = s.laserLevel ? 1 : 0;
        isLaserRunning = s.isLaserRunning !== undefined ? s.isLaserRunning : (laserLevel === 1);
        mergeGrid = s.mergeGrid || mergeGrid;
        equippedAuraId = s.equippedAuraId || "clean";

        document.getElementById("money").innerText = money;
        document.getElementById("depth").innerText = currentDepth;
        document.getElementById("relics").innerText = prestigeRelics;
        document.getElementById("powerBtn").innerText = `Power: Lv.${pickPower} ($${powerCost})`;
        document.getElementById("rangeBtn").innerText = rangeLevel === 3 ? "Radius: 3x3 (MAX)" : `Radius: ${RANGE_LABELS[rangeLevel]} ($${rangeCost})`;
        if (rangeLevel === 3) document.getElementById("rangeBtn").disabled = true;
        document.getElementById("incomeBtn").innerText = `Multiplier: ${incomeMultiplier}x ($${incomeCost})`;
        updateBiomeVisuals();
        updateGlowUI();
      } catch (e) {
        console.error(e);
      }
    }
    loadGame();

    // Main Loop
    function update() {
      if (currentMode === "mine") {
        mineCtx.clearRect(0, 0, mineCanvas.width, mineCanvas.height);
        updateLasers();

        // Draw Mine Blocks
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            let b = grid[r][c];
            if (!b) continue;
            drawMinecraftBlock(mineCtx, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, b);
          }
        }

        // Left Laser Turret
        if (laserLevel >= 1) {
          mineCtx.fillStyle = isLaserRunning ? "#f97316" : "#64748b";
          mineCtx.fillRect(0, 0, 4, TILE_SIZE);
        }

        for (let i = activeBeams.length - 1; i >= 0; i--) {
          let beam = activeBeams[i];
          mineCtx.strokeStyle = `rgba(249, 115, 22, ${beam.alpha})`;
          mineCtx.lineWidth = 3;
          mineCtx.beginPath();
          mineCtx.moveTo(beam.fromX, beam.y);
          mineCtx.lineTo(beam.toX, beam.y);
          mineCtx.stroke();

          beam.alpha -= 0.14;
          if (beam.alpha <= 0) activeBeams.splice(i, 1);
        }

        if (isGameRunning && mouseCol >= 0 && mouseRow >= 0) {
          const targets = getTargetArea(mouseCol, mouseRow);
          renderCustomReticle(mineCtx, targets);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25;
          p.life -= 0.04;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          mineCtx.fillStyle = p.color;
          mineCtx.globalAlpha = p.life;
          mineCtx.fillRect(p.x, p.y, p.size, p.size);
        }

        for (let i = floatTexts.length - 1; i >= 0; i--) {
          let ft = floatTexts[i];
          ft.y -= 1.1;
          ft.alpha -= 0.025;
          if (ft.alpha <= 0) { floatTexts.splice(i, 1); continue; }
          mineCtx.fillStyle = ft.color || "#ffffff";
          mineCtx.globalAlpha = Math.min(1.0, ft.alpha);
          mineCtx.font = "bold 13px 'Fredoka', sans-serif";
          mineCtx.fillText(ft.text, ft.x - 10, ft.y);
        }

        mineCtx.globalAlpha = 1.0;
      } else {
        renderMergeGame();
      }

      requestAnimationFrame(update);
    }
    update();
  </script>
</body>
</html>
